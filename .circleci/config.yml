# Golang CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.0/language-go/ for more details
version: 2.1
jobs:
  build:
    docker:
      # specify the version
      - image: cimg/go:1.24
      - image: cimg/mysql:8.0
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_USER: gfalcon
          MYSQL_PASSWORD: gfalcon
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/postgres:9.4

    #### TEMPLATE_NOTE: go expects specific checkout path representing url
    #### expecting it in the form of
    ####   /go/src/github.com/circleci/go-tool
    ####   /go/src/bitbucket.org/circleci/go-tool
    working_directory: /go/src/github.com/m0cchi/gfalcon
    steps:
      - checkout
      - run:
          name: wait for db
          command: dockerize -wait tcp://localhost:3306 -timeout 1m
      - run:
          name: install mysql client
          command: sudo apt update && sudo apt install -y default-mysql-client
      - run:
          name: setup db
          command: |
            mysql -h 127.0.0.1 -u gfalcon -pgfalcon -Dcircle_test < metatools/sql/0003_create_table.sql
            mysql -h 127.0.0.1 -u gfalcon -pgfalcon -Dcircle_test < metatools/sql/0004_create_defaultdata.sql
      - run:
          name: resolve dependency
          command: |
            go mod download
      - run:
          name: test
          environment:
            DATASOURCE: "gfalcon:gfalcon@tcp(127.0.0.1:3306)/circle_test?parseTime=true"
          command:  go test -v ./...

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
